<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --fg:#e6edf3; --muted:#8b949e;
    --border:#30363d; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --vuln:#f85149; --info:#58a6ff; --radius:12px; }
  html[data-theme="light"] { --bg:#f6f8fa; --panel:#fff; --panel2:#eef2f6; --fg:#1f2328; --muted:#656d76;
    --border:#d0d7de; --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --vuln:#cf222e; --info:#0969da; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .topbar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 14px; background:color-mix(in srgb,var(--panel) 92%,transparent); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); }
  .brand { font-weight:700; }
  .brand small { color:var(--muted); font-weight:400; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-left:auto; }
  input,select,button,label.chk { font:inherit; color:var(--fg); background:var(--panel2); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; }
  label.chk { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .meta { padding:18px 14px 8px; }
  .meta h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:12px; word-break:break-all; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip { background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:4px 11px; font-size:12.5px; }
  .chip b { color:var(--accent); }
  .models { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .model { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:12px; }
  .model b { color:var(--accent); }
  .table { margin:8px 14px 40px; }
  .row { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; overflow:hidden; }
  .row[hidden] { display:none; }
  .r-summary { list-style:none; cursor:pointer; padding:10px 12px; }
  .r-summary::-webkit-details-marker { display:none; }
  .s-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .kind { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    border:1px solid var(--border); border-radius:6px; padding:1px 6px; }
  .name { font-weight:600; }
  .path { color:var(--muted); font-size:12px; word-break:break-all; }
  .s-sum { margin-top:4px; font-size:12.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .s-cat { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; border-radius:999px;
    padding:3px 9px; border:1px solid transparent; white-space:nowrap; }
  .badge.ok { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); }
  .badge.warn { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent); }
  .badge.vuln { color:var(--vuln); border-color:color-mix(in srgb,var(--vuln) 45%,transparent); }
  .badge.info { color:var(--info); border-color:color-mix(in srgb,var(--info) 45%,transparent); }
  .badge.dispute { color:var(--accent); border-color:color-mix(in srgb,var(--accent) 45%,transparent); }
  .r-body { border-top:1px solid var(--border); padding:12px; display:grid; gap:12px; }
  @media (min-width:900px){ .r-body { grid-template-columns:1.1fr 1.3fr 1.4fr 1.1fr; } }
  .col-title { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:4px; }
  .lineref { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--accent); margin-bottom:6px; }
  pre.code { margin:0; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; overflow:auto;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.45; white-space:pre; }
  .clampable.is-clamped { max-height:5.4em; overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent); mask-image:linear-gradient(180deg,#000 60%,transparent); }
  pre.code.is-clamped { max-height:220px; }
  .vrow { display:flex; gap:8px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--border); }
  .vrow:last-child { border-bottom:0; }
  .vlabel { min-width:96px; font-size:11.5px; color:var(--muted); }
  .vsum { font-size:12px; }
  .asummary { font-size:12.5px; }
  .adetail { color:var(--muted); font-size:12px; margin-top:6px; }
  footer { color:var(--muted); font-size:11.5px; padding:10px 14px 40px; }
  #count { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">SCM Analyzer <small>{{t.subtitle}}</small></div>
  <div class="actions">
    <input id="search" type="search" placeholder="{{t.search}}" autocomplete="off">
    <select id="badgeFilter"><option value="">{{t.allVerdicts}}</option>
      <option value="VULNERABILITY">🛡️ {{t.badgeVuln}}</option>
      <option value="WARNING">⚠️ {{t.badgeWarn}}</option>
      <option value="PASS">✅ {{t.badgePass}}</option>
      <option value="INFO">ℹ️ {{t.badgeInfo}}</option></select>
    <label class="chk"><input type="checkbox" id="disputedOnly"> {{t.disputedOnly}}</label>
    <label class="chk"><input type="checkbox" id="hideBlank" checked> {{t.hideBlank}}</label>
    <button id="expandAll" type="button">{{t.expandAll}}</button>
    <button id="collapseAll" type="button">{{t.collapseAll}}</button>
    <button id="themeToggle" type="button">🌗</button>
  </div>
</header>

<section class="meta">
  <h1>{{REPO}}</h1>
  <div class="sub">{{SOURCE}} · generated {{GENERATED}} · <span id="count"></span></div>
  <div class="stats">{{STATS}}</div>
  <div class="models">{{MODELS}}</div>
</section>

<main class="table"><div id="rows">{{ROWS}}</div></main>
<footer>{{FOOTER}}</footer>

<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
  var search = document.getElementById('search');
  var badge = document.getElementById('badgeFilter');
  var disputedOnly = document.getElementById('disputedOnly');
  var hideBlank = document.getElementById('hideBlank');
  var count = document.getElementById('count');
  var ROWS_WORD = '{{t.rowsWord}}';
  function apply() {
    var q=(search.value||'').trim().toLowerCase(), b=badge.value, d=disputedOnly.checked, hb=hideBlank.checked, v=0;
    rows.forEach(function(r){
      var ok=(!q||(r.dataset.search||'').indexOf(q)!==-1)&&(!b||r.dataset.badge===b)&&
             (!d||r.dataset.disputed==='1')&&(!(hb&&r.dataset.kind==='blank'));
      r.hidden=!ok; if(ok)v++;
    });
    count.textContent=v+' / '+rows.length+' '+ROWS_WORD;
  }
  search.addEventListener('input',apply); badge.addEventListener('change',apply);
  disputedOnly.addEventListener('change',apply); hideBlank.addEventListener('change',apply);
  function clamps(){
    var limit=window.innerWidth*0.25;
    document.querySelectorAll('.clampable').forEach(function(el){
      if(el.dataset.expanded==='1')return;
      if(el.scrollWidth>limit||(el.scrollHeight>el.clientHeight+8&&el.clientHeight>0))el.classList.add('is-clamped');
    });
  }
  document.querySelectorAll('.clampable').forEach(function(el){
    el.addEventListener('click',function(){el.dataset.expanded='1';el.classList.remove('is-clamped');});
  });
  document.getElementById('expandAll').addEventListener('click',function(){
    document.querySelectorAll('.row').forEach(function(r){r.open=true;});
    document.querySelectorAll('.clampable').forEach(function(el){el.dataset.expanded='1';el.classList.remove('is-clamped');});
  });
  document.getElementById('collapseAll').addEventListener('click',function(){
    document.querySelectorAll('.row').forEach(function(r){r.open=false;});
    document.querySelectorAll('.clampable').forEach(function(el){delete el.dataset.expanded;el.classList.add('is-clamped');});
  });
  var t=document.getElementById('themeToggle'), s=null;
  try{s=localStorage.getItem('scm-super-theme');}catch(e){}
  if(s)document.documentElement.setAttribute('data-theme',s);
  t.addEventListener('click',function(){
    var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    try{localStorage.setItem('scm-super-theme',n);}catch(e){}
  });
  clamps();
  var tm; window.addEventListener('resize',function(){clearTimeout(tm);tm=setTimeout(clamps,150);});
  if(window.ResizeObserver){new ResizeObserver(function(){clearTimeout(tm);tm=setTimeout(clamps,150);}).observe(document.body);}
  apply();
})();
</script>
</body>
</html>
